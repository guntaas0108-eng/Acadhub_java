<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AcadHub · Faculty</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('acadhub-theme')||'dark'}catch(e){}</script>
</head>
<body data-page="faculty">
<header class="app-header"><div class="hdr-in">
  <a class="brand" href="faculty.html"><span class="logo">A</span>AcadHub</a>
  <nav class="nav"><a class="active" href="faculty.html">Faculty</a></nav>
  <div class="hdr-right">
    <button class="kbd-btn" data-open-palette type="button"><i data-i="search"></i><span>Search</span><kbd>Ctrl K</kbd></button>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light and dark theme"><i data-i="moon"></i><i data-i="sun"></i></button>
    <a class="btn ghost" href="index.html" onclick="if(window.logout){window.logout();return false}" aria-label="Sign out"><i data-i="logout"></i></a>
  </div>
</div></header>

<main class="container">
  <div class="page-head">
    <div><p class="eyebrow" data-clock></p><h1><span data-greeting>Hello</span>, <span id="welcomeName">Professor</span></h1></div>
  </div>

  <div class="bento">
    <section class="card span-12">
      <div class="seg" data-group="fac" role="tablist">
        <button type="button" data-tab="tabAtt" class="active">Attendance</button>
        <button type="button" data-tab="tabMarks">Enter Marks</button>
        <button type="button" data-tab="tabSummary">Class Summary</button>
      </div>

      <!-- Attendance Tab -->
      <div class="tab-panel show" data-group="fac" id="tabAtt">
        <div class="form-grid">
          <div class="field fixed"><input id="today" type="date" placeholder=" "><label for="today">Date</label></div>
          <div class="field sel fixed"><select id="fCourse"></select><label for="fCourse">Course</label></div>
        </div>
        <div class="form-actions">
          <button class="btn spin" type="button" onclick="window.loadStudents&&window.loadStudents()"><i data-i="users"></i>Load students</button>
          <button class="btn primary magnetic spin" type="button" onclick="window.markAttendance&&window.markAttendance()"><i data-i="clip"></i>Save attendance</button>
        </div>
        <div class="spacer"></div>
        <div class="table-wrap" data-empty-title="No students loaded" data-empty-text="Pick a course and date, then tap Load students.">
          <table><thead><tr><th>Student</th><th>Status</th></tr></thead><tbody id="attBody"></tbody></table>
        </div>
      </div>

      <!-- Marks Tab -->
      <div class="tab-panel" data-group="fac" id="tabMarks">
        <div class="form-grid">
          <div class="field sel fixed"><select id="mCourse" onchange="window.loadStudents&&window.loadStudents()"></select><label for="mCourse">Course</label></div>
          <div class="field sel fixed"><select id="mAssess"></select><label for="mAssess">Assessment</label></div>
          <div class="field"><input id="mStudent" type="number" placeholder=" " required><label for="mStudent">Student Roll No</label></div>
          <div class="field"><input id="mMarks" type="number" min="0" max="100" placeholder=" " required><label for="mMarks">Marks (0-100)</label></div>
        </div>
        <div class="form-actions"><button class="btn primary magnetic spin" type="button" onclick="window.saveMarks&&window.saveMarks()"><i data-i="award"></i>Save marks</button></div>
      </div>

      <!-- Summary Tab -->
      <div class="tab-panel" data-group="fac" id="tabSummary">
        <div class="table-wrap" data-empty-title="No summary yet" data-empty-text="Class attendance and grades will show up here.">
          <table><thead><tr><th>Student</th><th>Average Marks</th><th>Grade</th></tr></thead><tbody id="summaryBody"></tbody></table>
        </div>
      </div>
    </section>
  </div>
</main>

<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>

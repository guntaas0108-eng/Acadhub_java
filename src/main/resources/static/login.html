
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AcadHub | Portal Login</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:'Plus Jakarta Sans',sans-serif;
color:#eafafa;
background:
radial-gradient(ellipse at 20% 15%,#103b42,transparent 45%),
radial-gradient(ellipse at 85% 75%,#182b50,transparent 45%),
#050e14;
}

nav{
padding:17px 35px;
display:flex;
justify-content:space-between;
align-items:center;
background:#071820cc;
border-bottom:1px solid #14b8a633;
}

.brand{
font-size:20px;
font-weight:800;
text-decoration:none;
color:white;
}

.logo{
display:inline-grid;
place-items:center;
width:35px;
height:35px;
border-radius:10px;
margin-right:8px;
color:#07131a;
background:linear-gradient(135deg,#14b8a6,#38bdf8,#a855f7);
}

.home{
color:#5eead4;
text-decoration:none;
font-size:13px;
font-weight:700;
}

.container{
min-height:calc(100vh - 70px);
display:flex;
justify-content:center;
align-items:center;
padding:35px 15px;
}

.login{
width:100%;
max-width:495px;
padding:32px;
background:#0b1921ef;
border:1px solid #38bdf855;
border-radius:23px;
box-shadow:0 25px 70px #0008,0 0 35px #a855f722;
}

.heading{
text-align:center;
margin-bottom:25px;
}

.heading h1{
font-size:36px;
margin:0 0 8px;
background:linear-gradient(90deg,#fff,#2dd4bf,#38bdf8,#c084fc);
background-clip:text;
-webkit-background-clip:text;
color:transparent;
}

.heading p{
color:#91aab3;
font-size:13px;
}

/* ROLE BUTTONS */

.roles{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
margin:22px 0;
}

.role{
padding:14px 5px;
border-radius:13px;
border:1px solid #ffffff20;
background:#ffffff08;
color:#a9c0c9;
cursor:pointer;
font-weight:700;
font-family:inherit;
transition:.25s;
}

.role:hover{
background:#ffffff12;
transform:translateY(-2px);
}

.role.active{
color:white;
border-color:#a855f7;
box-shadow:0 0 15px #a855f755;
background:#a855f71c;
}

.role span{
display:block;
font-size:22px;
margin-bottom:6px;
}

/* INPUT FIELDS */

.login .field{
display:flex !important;
flex-direction:column !important;
align-items:stretch !important;
width:100%;
gap:8px;
margin:17px 0;
position:relative;
}

.login .field label{
position:static !important;
display:block !important;
float:none !important;
transform:none !important;
width:100%;
color:#91aab3 !important;
font-size:12px !important;
font-weight:700;
line-height:18px !important;
margin:0 !important;
padding:0 !important;
}

.login .field input{
display:block !important;
position:relative !important;
width:100% !important;
height:53px !important;
min-height:53px;
padding:0 14px !important;
background:#142c36 !important;
border:1px solid #14b8a655 !important;
border-radius:11px !important;
color:white !important;
outline:none;
font-family:inherit;
font-size:13px !important;
line-height:normal !important;
text-align:left !important;
box-shadow:none;
}

.login .field input::placeholder{
color:#91aab3 !important;
opacity:.85 !important;
}

.login .field input:focus{
border-color:#38bdf8 !important;
box-shadow:0 0 12px #38bdf833 !important;
}

/* PASSWORD */

.password{
display:block !important;
position:relative;
width:100%;
}

.password input{
padding-right:55px !important;
}

.eye{
position:absolute;
right:7px;
top:7px;
height:39px;
width:39px;
background:#142c36;
border:1px solid #ffffff20;
border-radius:9px;
color:#9bb4bf;
cursor:pointer;
}

/* LOGIN BUTTON */

.submit{
width:100%;
padding:16px;
border:0;
border-radius:11px;
background:linear-gradient(110deg,#0d9488,#0284c7,#9333ea);
color:white;
font-weight:800;
font-family:inherit;
font-size:15px;
cursor:pointer;
margin-top:12px;
transition:.25s;
}

.submit:hover{
filter:brightness(1.15);
box-shadow:0 8px 25px #0284c755;
transform:translateY(-2px);
}

.error{
color:#fb7185;
font-size:12px;
margin:10px 0;
}

.note{
text-align:center;
color:#819ba5;
font-size:11px;
margin-top:20px;
}

@media(max-width:450px){
.login{padding:23px}
.role{font-size:11px}
nav{padding:15px 18px}
.heading h1{font-size:30px}
}
</style>
</head>

<body>

<!-- NAVBAR -->

<nav>
<a href="index.html" class="brand">
<span class="logo">A</span>AcadHub
</a>
<a href="index.html" class="home">← Home</a>
</nav>

<!-- LOGIN SECTION -->

<div class="container">
<div class="login">

<div class="heading">
<h1 id="welcomeTitle">Welcome Student!</h1>
<p>Sign in to access your AcadHub portal</p>
</div>

<!-- ROLE SELECTION -->

<div class="roles">

<button type="button" class="role" data-role="ADMIN">
<span>🛡️</span>Admin
</button>

<button type="button" class="role" data-role="FACULTY">
<span>📘</span>Faculty
</button>

<button type="button" class="role active" data-role="STUDENT">
<span>🎓</span>Student
</button>

</div>

<!-- LOGIN FORM -->

<form id="loginForm"
onsubmit="if(window.login){window.login()} return false;"
novalidate>

<select id="role" name="role" hidden>
<option value="ADMIN">Admin</option>
<option value="FACULTY">Faculty</option>
<option value="STUDENT" selected>Student</option>
</select>

<!-- USERNAME -->

<div class="field">

<label for="username">Username</label>

<input
id="username"
name="username"
type="text"
placeholder="kriti16"
autocomplete="off"
required>

</div>

<!-- PASSWORD -->

<div class="field">

<label for="password">Password</label>

<div class="password">

<input
id="password"
name="password"
type="password"
placeholder="Enter your password"
autocomplete="new-password"
required>

<button type="button" class="eye" id="eye"
aria-label="Show password">👁</button>

</div>
</div>

<p id="loginError" class="error" role="alert"></p>

<button type="submit" id="loginBtn" class="submit">
Initialize Session →
</button>

</form>

<p class="note">
Secure Academic Portal · AcadHub 2026
</p>

</div>
</div>

<!-- EXISTING JAVASCRIPT FILES -->

<script src="ui.js"></script>
<script src="app.js"></script>

<script>

// ROLE INFORMATION

const roleDetails = {

STUDENT:{
welcome:"Welcome Student!",
username:"kriti16"
},

FACULTY:{
welcome:"Welcome Faculty!",
username:"rumneek24"
},

ADMIN:{
welcome:"Welcome Admin!",
username:"doaa30"
}

};

// ELEMENTS

const roleSelect = document.getElementById('role');
const username = document.getElementById('username');
const password = document.getElementById('password');
const welcomeTitle = document.getElementById('welcomeTitle');
const loginError = document.getElementById('loginError');

// ROLE SELECTION FUNCTION

function selectRole(role){

const details = roleDetails[role];

if(!details) return;

// Update selected role
roleSelect.value = role;

// Update heading
welcomeTitle.textContent = details.welcome;

// Show username as light placeholder
username.value = "";
username.placeholder = details.username;

// Clear password
password.value = "";
password.type = "password";

// Clear previous errors
loginError.textContent = "";

// Update selected button
document.querySelectorAll('.role').forEach(button=>{

button.classList.toggle(
'active',
button.dataset.role === role
);

});

}

// ROLE BUTTON EVENTS

document.querySelectorAll('.role').forEach(button=>{

button.addEventListener('click',()=>{

selectRole(button.dataset.role);

});

});

// DEFAULT ROLE

selectRole('STUDENT');

// SHOW / HIDE PASSWORD

document.getElementById('eye').addEventListener('click',()=>{

const hidden = password.type === 'password';

password.type = hidden ? 'text' : 'password';

document.getElementById('eye').textContent =
hidden ? '🙈' : '👁';

});

</script>

</body>
</html>

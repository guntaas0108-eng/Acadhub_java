<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcadHub | Portal Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261106.8">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: #E7F5F6;
  background: #050E14;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 16px;
  position: relative;
  overflow-x: hidden;
}

/* AcadHub Signature Drifting Mesh & Starfield Background */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(ellipse at 15% 12%, rgba(20, 184, 166, 0.22), transparent 42%),
    radial-gradient(ellipse at 85% 25%, rgba(56, 189, 248, 0.18), transparent 40%),
    radial-gradient(ellipse at 50% 85%, rgba(168, 85, 247, 0.16), transparent 45%),
    linear-gradient(145deg, #071820 0%, #050E14 55%, #08131D 100%);
}

.stars {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    radial-gradient(#14B8A6 1.4px, transparent 1.8px),
    radial-gradient(#38BDF8 1px, transparent 1.5px),
    radial-gradient(#A855F7 1.2px, transparent 1.7px);
  background-size: 230px 190px, 310px 260px, 370px 300px;
  background-position: 20px 30px, 100px 90px, 170px 40px;
  opacity: .35;
}

/* Top Mini Header Navigation */
.top-nav {
  position: absolute;
  top: 20px;
  left: 32px;
  right: 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}
.brand-link {
  display: flex;
  align-items: center;
  gap: 11px;
  text-decoration: none;
  color: #FFFFFF;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: -0.02em;
}
.brand-logo {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, #14B8A6, #38BDF8, #A855F7);
  color: #050E14;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 19px;
  box-shadow: 0 0 20px rgba(20, 184, 166, 0.45);
}
.back-link {
  text-decoration: none;
  color: #5EEAD4;
  font-size: 13px;
  font-weight: 700;
  background: rgba(14, 32, 41, 0.65);
  backdrop-filter: blur(12px);
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid rgba(20, 184, 166, 0.28);
  transition: all .2s ease;
}
.back-link:hover {
  background: rgba(20, 184, 166, 0.18);
  border-color: #14B8A6;
  transform: translateY(-1px);
}

/* Main Split Card (Exact Composition of Reference Screenshot) */
.auth-stage {
  width: 100%;
  max-width: 1040px;
  background: rgba(11, 25, 33, 0.88);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(56, 189, 248, 0.24);
  border-radius: 24px;
  box-shadow: 0 25px 70px rgba(0, 0, 0, 0.65), 0 0 35px rgba(20, 184, 166, 0.16);
  display: grid;
  grid-template-columns: 1fr 1.12fr;
  align-items: stretch;
  overflow: hidden;
  position: relative;
  z-index: 5;
  margin-top: 36px;
}

/* Left Column: Login Form Pane */
.form-pane {
  padding: 44px 44px 38px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: transparent;
  border-right: 1px solid rgba(255, 255, 255, 0.06);
}

.pane-heading {
  margin-bottom: 22px;
}
.pane-heading h1 {
  font-size: 32px;
  font-weight: 800;
  background: linear-gradient(90deg, #FFFFFF, #2DD4BF, #38BDF8);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -0.03em;
  margin-bottom: 6px;
}
.pane-heading p {
  font-size: 13.5px;
  color: #8CA8B1;
  font-weight: 500;
}
.pane-heading p a {
  color: #14B8A6;
  text-decoration: none;
  font-weight: 700;
}
.pane-heading p a:hover {
  text-decoration: underline;
}

/* Role Selector Tabs (Preserving RBAC Feature) */
.role-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  background: rgba(14, 32, 41, 0.7);
  padding: 5px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  margin-bottom: 22px;
}
.role-tab-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 10px;
  border-radius: 9px;
  border: 1px solid transparent;
  background: transparent;
  color: #8CA8B1;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
}
.role-tab-btn:hover {
  color: #E7F5F6;
  background: rgba(255, 255, 255, 0.04);
}
.role-tab-btn.active {
  background: linear-gradient(135deg, #14B8A6, #0D9488);
  color: #031417;
  font-weight: 800;
  box-shadow: 0 4px 14px rgba(20, 184, 166, 0.4);
}

/* Form Fields */
.form-group {
  margin-bottom: 16px;
}
.form-label-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 7px;
}
.form-label {
  font-size: 13px;
  font-weight: 700;
  color: #B5C8CE;
  display: block;
}
.forgot-link {
  font-size: 12px;
  font-weight: 600;
  color: #38BDF8;
  text-decoration: none;
}
.forgot-link:hover {
  text-decoration: underline;
  color: #5EEAD4;
}

.input-box {
  position: relative;
  width: 100%;
}
.input-box input {
  width: 100%;
  padding: 12px 14px;
  font-size: 14px;
  color: #E7F5F6;
  background: rgba(14, 32, 41, 0.7);
  border: 1.5px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  outline: none;
  transition: all .2s ease;
  font-family: inherit;
}
.input-box input:focus {
  border-color: #14B8A6;
  box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.22);
  background: rgba(14, 32, 41, 0.9);
}
.input-box input::placeholder {
  color: #58747D;
  font-size: 13px;
}

.password-toggle-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: #8CA8B1;
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 4px;
  font-size: 15px;
  transition: color .2s;
}
.password-toggle-btn:hover {
  color: #5EEAD4;
}

/* Checkbox Row */
.remember-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
}
.remember-row input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: #14B8A6;
  cursor: pointer;
  border-radius: 4px;
}
.remember-row label {
  font-size: 13px;
  color: #8CA8B1;
  font-weight: 500;
  cursor: pointer;
}

/* Error Message */
.form-error {
  min-height: 20px;
  font-size: 12.5px;
  color: #EF4444;
  font-weight: 600;
  margin-bottom: 12px;
}

/* Primary Vibrant Login Button */
.btn-login-theme {
  width: 100%;
  padding: 13px 20px;
  background: linear-gradient(115deg, #14B8A6, #0EA5E9 52%, #A855F7);
  background-size: 180% auto;
  color: #FFFFFF;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all .25s ease;
  box-shadow: 0 6px 22px rgba(14, 165, 233, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: inherit;
}
.btn-login-theme:hover {
  background-position: 100% 0;
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(14, 165, 233, 0.5);
}
.btn-login-theme:active {
  transform: translateY(0);
}

/* Quick Role Switcher Buttons */
.divider {
  display: flex;
  align-items: center;
  text-align: center;
  margin: 18px 0;
  color: #58747D;
  font-size: 11.5px;
  font-weight: 600;
}
.divider::before, .divider::after {
  content: "";
  flex: 1;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.divider span {
  padding: 0 12px;
}

.social-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.btn-preset {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 14px;
  background: rgba(14, 32, 41, 0.6);
  border: 1.5px solid rgba(255, 255, 255, 0.08);
  border-radius: 9px;
  color: #B5C8CE;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
}
.btn-preset:hover {
  background: rgba(20, 184, 166, 0.12);
  border-color: rgba(20, 184, 166, 0.4);
  color: #5EEAD4;
  transform: translateY(-1px);
}

/* Right Column: Illustration Pane in Ocean Teal Theme */
.illustration-pane {
  background: rgba(7, 19, 26, 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  position: relative;
}

.illustration-svg {
  width: 100%;
  max-width: 500px;
  height: auto;
  display: block;
}

/* Subtle floating badge keyframe */
@keyframes badgeFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}
.badge-1 { animation: badgeFloat 3.4s ease-in-out infinite; }
.badge-2 { animation: badgeFloat 4s ease-in-out infinite 0.7s; }
.badge-3 { animation: badgeFloat 3.6s ease-in-out infinite 1.3s; }
.badge-4 { animation: badgeFloat 4.2s ease-in-out infinite 0.4s; }

/* Responsive Viewports */
@media (max-width: 860px) {
  .auth-stage {
    grid-template-columns: 1fr;
    max-width: 480px;
    margin-top: 50px;
  }
  .illustration-pane {
    display: none;
  }
  .form-pane {
    padding: 36px 24px;
    border-right: none;
  }
  .top-nav {
    left: 18px;
    right: 18px;
  }
}
</style>
</head>

<body>

<div class="stars"></div>

<!-- Top Navigation -->
<header class="top-nav">
  <a href="index.html" class="brand-link">
    <div class="brand-logo">A</div>
    <span>AcadHub</span>
  </a>
  <a href="index.html" class="back-link">← Back to Home</a>
</header>

<!-- Main Split Auth Stage (Layout from Screenshot in AcadHub Theme) -->
<main class="auth-stage">

  <!-- Left Form Column -->
  <section class="form-pane">
    <div class="pane-heading">
      <h1>Login</h1>
      <p>Doesn't have an account yet? <a href="index.html#portals">Contact Admin</a></p>
    </div>

    <!-- Role Switcher Tabs (Admin, Faculty, Student) -->
    <div class="role-tabs" role="tablist" aria-label="Select Role">
      <button type="button" class="role-tab-btn active" data-role="STUDENT">
        <span>🎓</span> Student
      </button>
      <button type="button" class="role-tab-btn" data-role="FACULTY">
        <span>📘</span> Faculty
      </button>
      <button type="button" class="role-tab-btn" data-role="ADMIN">
        <span>🛡️</span> Admin
      </button>
    </div>

    <!-- Main Authentication Form -->
    <form id="loginForm" onsubmit="window.login&&window.login();return false" novalidate>
      <select id="role" hidden>
        <option value="STUDENT" selected>Student</option>
        <option value="FACULTY">Faculty</option>
        <option value="ADMIN">Admin</option>
      </select>

      <!-- Username / Roll No -->
      <div class="form-group">
        <label class="form-label" for="username">Username or Roll Number</label>
        <div class="input-box">
          <input id="username" type="text" placeholder="you@example.com or roll no" autocomplete="username" required>
        </div>
      </div>

      <!-- Password Field with Forgot Password Link -->
      <div class="form-group">
        <div class="form-label-row">
          <label class="form-label" for="password">Password</label>
          <a href="javascript:void(0)" onclick="if(window.UI&&window.UI.toast){window.UI.toast('info','Please contact the Dean of Academic Affairs (doaa30) to reset credentials.')}" class="forgot-link">Forgot Password?</a>
        </div>
        <div class="input-box">
          <input id="password" type="password" placeholder="Enter 6 character or more" autocomplete="current-password" required>
          <button type="button" class="password-toggle-btn" id="pwToggle" aria-label="Toggle password visibility">
            <span id="pwIcon">👁️</span>
          </button>
        </div>
      </div>

      <!-- Remember Me -->
      <div class="remember-row">
        <input type="checkbox" id="rememberMe" checked>
        <label for="rememberMe">Remember me</label>
      </div>

      <!-- Error Box -->
      <p id="loginError" class="form-error" role="alert"></p>

      <!-- Main Login Button -->
      <button id="loginBtn" class="btn-login-theme" type="submit">
        <span>LOGIN</span> →
      </button>

      <!-- Divider -->
      <div class="divider">
        <span>or quick preset</span>
      </div>

      <!-- Quick Preset Switcher Buttons -->
      <div class="social-grid">
        <button type="button" class="btn-preset" onclick="window.switchAndFillRole('STUDENT')">
          <span style="font-size:15px;">🎓</span> Student Demo
        </button>
        <button type="button" class="btn-preset" onclick="window.switchAndFillRole('FACULTY')">
          <span style="font-size:15px;">📘</span> Faculty Demo
        </button>
      </div>
    </form>
  </section>

  <!-- Right Column: Vector Artwork matching Screenshot in AcadHub Ocean Teal Theme -->
  <section class="illustration-pane" aria-hidden="true">
    <svg class="illustration-svg" viewBox="0 0 600 460" fill="none" xmlns="http://www.w3.org/2000/svg">

      <!-- Desktop Table Surface -->
      <rect x="215" y="250" width="320" height="10" rx="3" fill="#0E2029" stroke="rgba(20, 184, 166, 0.4)" stroke-width="1"/>

<script>
// Show/Hide Password Toggle
const pwInput = document.getElementById('password');
const pwToggle = document.getElementById('pwToggle');
const pwIcon = document.getElementById('pwIcon');

if (pwToggle && pwInput) {
  pwToggle.addEventListener('click', () => {
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    pwIcon.textContent = isPw ? '🙈' : '👁️';
  });
}

// Preset Demo Credentials
const DEMO_PRESETS = {
  STUDENT: { u: 'kriti16', p: 'kri16' },
  FACULTY: { u: 'rumneek24', p: 'rum24' },
  ADMIN:   { u: 'doaa30', p: 'adm@123' }
};

// Switch Role Function
window.switchAndFillRole = function(role) {
  const roleSelect = document.getElementById('role');
  const uInput = document.getElementById('username');
  const pInput = document.getElementById('password');
  const errBox = document.getElementById('loginError');

  if (roleSelect) roleSelect.value = role;
  if (errBox) errBox.textContent = '';

  document.querySelectorAll('.role-tab-btn').forEach(btn => {
    if (btn.dataset.role === role) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });

  if (DEMO_PRESETS[role]) {
    if (uInput) uInput.value = DEMO_PRESETS[role].u;
    if (pInput) pInput.value = DEMO_PRESETS[role].p;
  }
};

// Wire up Role Tab clicks
document.querySelectorAll('.role-tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    window.switchAndFillRole(btn.dataset.role);
  });
});

// Auto-fill Student default credentials on initial load
window.addEventListener('DOMContentLoaded', () => {
  const uInput = document.getElementById('username');
  const pInput = document.getElementById('password');
  if (uInput && !uInput.value) uInput.value = DEMO_PRESETS.STUDENT.u;
  if (pInput && !pInput.value) pInput.value = DEMO_PRESETS.STUDENT.p;
});
</script>

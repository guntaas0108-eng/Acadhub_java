<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcadHub | Portal Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261106.9">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: #E7F5F6;
  background: #050E14;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  position: relative;
  overflow-x: hidden;
}

/* AcadHub Signature Midnight Ambient Backdrop */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(ellipse at 18% 15%, rgba(20, 184, 166, 0.24), transparent 42%),
    radial-gradient(ellipse at 82% 28%, rgba(56, 189, 248, 0.20), transparent 44%),
    radial-gradient(ellipse at 50% 88%, rgba(124, 58, 237, 0.22), transparent 48%),
    linear-gradient(145deg, #071820 0%, #050E14 55%, #08131D 100%);
}

.stars {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    radial-gradient(#14B8A6 1.4px, transparent 1.8px),
    radial-gradient(#38BDF8 1px, transparent 1.5px),
    radial-gradient(#A855F7 1.2px, transparent 1.7px);
  background-size: 240px 200px, 320px 270px, 380px 310px;
  background-position: 20px 30px, 110px 95px, 180px 45px;
  opacity: .35;
}

/* Top Mini Header Navigation */
.top-nav {
  position: absolute;
  top: 24px;
  left: 36px;
  right: 36px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}
.brand-link {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: #FFFFFF;
  font-weight: 800;
  font-size: 21px;
  letter-spacing: -0.02em;
}
.brand-logo {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: linear-gradient(135deg, #14B8A6, #38BDF8 55%, #8B5CF6);
  color: #050E14;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 20px;
  box-shadow: 0 0 24px rgba(20, 184, 166, 0.45);
}
.back-link {
  text-decoration: none;
  color: #5EEAD4;
  font-size: 13.5px;
  font-weight: 700;
  background: rgba(14, 32, 41, 0.7);
  backdrop-filter: blur(12px);
  padding: 8px 18px;
  border-radius: 999px;
  border: 1px solid rgba(20, 184, 166, 0.3);
  transition: all .2s ease;
}
.back-link:hover {
  background: rgba(20, 184, 166, 0.2);
  border-color: #14B8A6;
  transform: translateY(-1px);
}

/* ============================================================ */
/* MAIN 2-COLUMN SPLIT STAGE (Exact Layout of Reference Image)  */
/* ============================================================ */
.auth-stage {
  width: 100%;
  max-width: 1120px;
  background: rgba(9, 23, 31, 0.88);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(56, 189, 248, 0.25);
  border-radius: 26px;
  box-shadow: 0 30px 85px rgba(0, 0, 0, 0.7), 0 0 45px rgba(20, 184, 166, 0.16);
  display: grid;
  grid-template-columns: 460px 1fr;
  align-items: stretch;
  overflow: hidden;
  position: relative;
  z-index: 5;
  margin-top: 36px;
}

/* Left Column: Form Card Container */
.form-column {
  padding: 38px 36px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-right: 1px solid rgba(255, 255, 255, 0.07);
  background: rgba(12, 28, 37, 0.5);
}

/* Card-within-card effect matching the reference UI */
.login-card-inner {
  background: rgba(14, 32, 42, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 20px;
  padding: 32px 28px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
}

.pane-heading {
  margin-bottom: 20px;
}
.pane-heading h1 {
  font-size: 30px;
  font-weight: 800;
  color: #FFFFFF;
  letter-spacing: -0.03em;
  margin-bottom: 6px;
}
.pane-heading p {
  font-size: 13.5px;
  color: #8CA8B1;
  font-weight: 500;
}
.pane-heading p a {
  color: #14B8A6;
  text-decoration: none;
  font-weight: 700;
}
.pane-heading p a:hover {
  text-decoration: underline;
}

/* Role Selector Tabs (Student, Faculty, Admin) */
.role-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  background: rgba(8, 20, 27, 0.85);
  padding: 5px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.07);
  margin-bottom: 20px;
}
.role-tab-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 6px;
  border-radius: 9px;
  border: 1px solid transparent;
  background: transparent;
  color: #8CA8B1;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s ease;
  font-family: inherit;
}
.role-tab-btn:hover {
  color: #E7F5F6;
  background: rgba(255, 255, 255, 0.05);
}
.role-tab-btn.active {
  background: linear-gradient(135deg, #14B8A6, #0D9488);
  color: #031417;
  font-weight: 800;
  box-shadow: 0 4px 14px rgba(20, 184, 166, 0.4);
}
.role-tab-btn.active[data-role="FACULTY"] {
  background: linear-gradient(135deg, #0284C7, #38BDF8);
  color: #031417;
  box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
}
.role-tab-btn.active[data-role="ADMIN"] {
  background: linear-gradient(135deg, #7C3AED, #A855F7);
  color: #FFFFFF;
  box-shadow: 0 4px 14px rgba(168, 85, 247, 0.4);
}

/* Form Fields */
.form-group {
  margin-bottom: 16px;
}
.form-label-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 7px;
}
.form-label {
  font-size: 13px;
  font-weight: 700;
  color: #B5C8CE;
  display: block;
}
.forgot-link {
  font-size: 12px;
  font-weight: 600;
  color: #38BDF8;
  text-decoration: none;
}
.forgot-link:hover {
  text-decoration: underline;
  color: #5EEAD4;
}

.input-box {
  position: relative;
  width: 100%;
}
.input-box input {
  width: 100%;
  padding: 12px 14px;
  font-size: 14px;
  color: #E7F5F6;
  background: rgba(7, 18, 25, 0.85);
  border: 1.5px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  outline: none;
  transition: all .2s ease;
  font-family: inherit;
}
.input-box input:focus {
  border-color: #14B8A6;
  box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.22);
  background: rgba(7, 18, 25, 0.98);
}
.input-box input::placeholder {
  color: #58747D;
  font-size: 13px;
}

.password-toggle-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: #8CA8B1;
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 4px;
  font-size: 15px;
  transition: color .2s;
}
.password-toggle-btn:hover {
  color: #5EEAD4;
}

/* Remember Me Checkbox */
.remember-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 18px;
}
.remember-row input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: #14B8A6;
  cursor: pointer;
  border-radius: 4px;
}
.remember-row label {
  font-size: 13px;
  color: #8CA8B1;
  font-weight: 500;
  cursor: pointer;
}

/* Error Message */
.form-error {
  min-height: 20px;
  font-size: 12.5px;
  color: #EF4444;
  font-weight: 600;
  margin-bottom: 12px;
}

/* Main Vibrant Login Button (Reference Pill Style in Ocean Teal/Purple) */
.btn-login-theme {
  width: 100%;
  padding: 13px 20px;
  background: linear-gradient(115deg, #7C3AED, #6366F1 50%, #14B8A6);
  background-size: 180% auto;
  color: #FFFFFF;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all .25s ease;
  box-shadow: 0 6px 22px rgba(124, 58, 237, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: inherit;
}
.btn-login-theme:hover {
  background-position: 100% 0;
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(20, 184, 166, 0.45);
}
.btn-login-theme:active {
  transform: translateY(0);
}

/* Divider: "or quick preset" */
.divider {
  display: flex;
  align-items: center;
  text-align: center;
  margin: 18px 0;
  color: #58747D;
  font-size: 11.5px;
  font-weight: 600;
}
.divider::before, .divider::after {
  content: "";
  flex: 1;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.divider span {
  padding: 0 12px;
}

/* Quick Demo Switchers (matching Google / Facebook card buttons in reference) */
.social-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.btn-preset {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 10px 12px;
  background: rgba(7, 18, 25, 0.7);
  border: 1.5px solid rgba(255, 255, 255, 0.09);
  border-radius: 9px;
  color: #B5C8CE;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
}
.btn-preset:hover {
  background: rgba(20, 184, 166, 0.12);
  border-color: rgba(20, 184, 166, 0.4);
  color: #5EEAD4;
  transform: translateY(-1px);
}

/* ============================================================ */
/* RIGHT COLUMN: DYNAMIC ROLE ILLUSTRATION PANE                 */
/* ============================================================ */
.illustration-pane {
  background: radial-gradient(circle at 60% 40%, rgba(14, 34, 46, 0.95), rgba(7, 19, 26, 0.92));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 30px;
  position: relative;
  overflow: hidden;
}

/* Dynamic Role Header Banner above illustration */
.illust-role-header {
  margin-bottom: 8px;
  text-align: center;
  z-index: 5;
}
.illust-role-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.03em;
  background: rgba(20, 184, 166, 0.16);
  border: 1px solid rgba(20, 184, 166, 0.38);
  color: #5EEAD4;
  box-shadow: 0 0 20px rgba(20, 184, 166, 0.2);
  transition: all .3s ease;
}
.illust-role-desc {
  font-size: 12.5px;
  color: #8CA8B1;
  margin-top: 6px;
  font-weight: 500;
  max-width: 440px;
  line-height: 1.45;
  transition: all .3s ease;
}

/* Scene Stage & Smooth Cross-Fade */
.scene-stage {
  position: relative;
  width: 100%;
  max-width: 580px;
  min-height: 400px;
  display: grid;
  place-items: center;
}
.illust-scene {
  grid-area: 1 / 1;
  width: 100%;
  height: auto;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.96) translateY(8px);
  transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.illust-scene.active {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1) translateY(0);
}

/* Floating animation for badge bubbles */
@keyframes badgeFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}
.b-float-1 { animation: badgeFloat 3.2s ease-in-out infinite; }
.b-float-2 { animation: badgeFloat 3.8s ease-in-out infinite 0.6s; }
.b-float-3 { animation: badgeFloat 3.5s ease-in-out infinite 1.2s; }
.b-float-4 { animation: badgeFloat 4.1s ease-in-out infinite 0.3s; }

/* Responsive Viewports */
@media (max-width: 960px) {
  .auth-stage {
    grid-template-columns: 1fr;
    max-width: 500px;
    margin-top: 60px;
  }
  .form-column {
    border-right: none;
    padding: 30px 22px;
  }
  .illustration-pane {
    display: none;
  }
  .top-nav {
    left: 20px;
    right: 20px;
  }
}
</style>
</head>

<body>

<div class="stars"></div>

<!-- Top Navigation -->
<header class="top-nav">
  <a href="index.html" class="brand-link">
    <div class="brand-logo">A</div>
    <span>AcadHub</span>
  </a>
  <a href="index.html" class="back-link">← Back to Home</a>
</header>

<!-- Main Split Auth Stage (Reference Image Layout in Ocean Teal Theme) -->
<main class="auth-stage">

  <!-- Left Form Column -->
  <section class="form-column">
    <div class="login-card-inner">
      <div class="pane-heading">
        <h1>Login</h1>
        <p>Doesn't have an account yet? <a href="index.html#portals">Contact Admin</a></p>
      </div>

      <!-- Role Switcher Tabs (Student, Faculty, Admin) -->
      <div class="role-tabs" role="tablist" aria-label="Select Role">
        <button type="button" class="role-tab-btn active" data-role="STUDENT">
          <span>🎓</span> Student
        </button>
        <button type="button" class="role-tab-btn" data-role="FACULTY">
          <span>📘</span> Faculty
        </button>
        <button type="button" class="role-tab-btn" data-role="ADMIN">
          <span>🛡️</span> Admin
        </button>
      </div>

      <!-- Main Authentication Form -->
      <form id="loginForm" onsubmit="window.login&&window.login();return false" novalidate>
        <select id="role" hidden>
          <option value="STUDENT" selected>Student</option>
          <option value="FACULTY">Faculty</option>
          <option value="ADMIN">Admin</option>
        </select>

        <!-- Username / Roll No -->
        <div class="form-group">
          <label class="form-label" for="username">Email Address or Roll No</label>
          <div class="input-box">
            <input id="username" type="text" placeholder="you@example.com or roll no" autocomplete="username" required>
          </div>
        </div>

        <!-- Password Field with Forgot Password Link -->
        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="password">Password</label>
            <a href="javascript:void(0)" onclick="if(window.UI&&window.UI.toast){window.UI.toast('info','Please contact Dean of Academic Affairs (doaa30) to reset credentials.')}" class="forgot-link">Forgot Password?</a>
          </div>
          <div class="input-box">
            <input id="password" type="password" placeholder="Enter 6 character or more" autocomplete="current-password" required>
            <button type="button" class="password-toggle-btn" id="pwToggle" aria-label="Toggle password visibility">
              <span id="pwIcon">👁️</span>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="remember-row">
          <input type="checkbox" id="rememberMe" checked>
          <label for="rememberMe">Remember me</label>
        </div>

        <!-- Error Box -->
        <p id="loginError" class="form-error" role="alert"></p>

        <!-- Main Login Button -->
        <button id="loginBtn" class="btn-login-theme" type="submit">
          <span>LOGIN</span> →
        </button>

        <!-- Divider -->
        <div class="divider">
          <span>or quick preset</span>
        </div>

        <!-- Quick Preset Switcher Buttons -->
        <div class="social-grid">
          <button type="button" class="btn-preset" onclick="window.switchAndFillRole('STUDENT')">
            <span style="font-size:15px;">🎓</span> Student Demo
          </button>
          <button type="button" class="btn-preset" onclick="window.switchAndFillRole('FACULTY')">
            <span style="font-size:15px;">📘</span> Faculty Demo
          </button>
        </div>
      </form>
    </div>
  </section>

  <!-- Right Column: Dynamic Role Workstation Illustration -->
  <section class="illustration-pane" aria-label="Role Workstation Illustration">
    
    <!-- Dynamic Role Header Banner -->
    <div class="illust-role-header">
      <div class="illust-role-badge" id="illustRoleBadge">
        <span>🎓</span> Student Learning Desk
      </div>
      <p class="illust-role-desc" id="illustRoleDesc">
        Access enrolled course study materials, submit lab assignments, track 79% marks & 75% attendance.
      </p>
    </div>

    <!-- 3 Dynamic Vector Scenes Container -->
    <div class="scene-stage">

      <!-- ============================================================ -->
      <!-- SCENE 1: STUDENT WORKSPACE (Active by default)                 -->
      <!-- ============================================================ -->
      <svg class="illust-scene active" id="sceneStudent" viewBox="0 0 680 440" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Ambient Glowing Aura -->
        <circle cx="390" cy="200" r="160" fill="#14B8A6" opacity="0.12"/>
        <ellipse cx="430" cy="385" rx="140" ry="24" fill="#38BDF8" opacity="0.08"/>

        <!-- Modern Desk Trestle Legs -->
        <polygon points="275,250 283,250 225,395 215,395" fill="#14303C"/>
        <polygon points="305,250 313,250 355,395 345,395" fill="#0E2029"/>
        <polygon points="535,250 543,250 585,395 575,395" fill="#14303C"/>
        <polygon points="505,250 513,250 465,395 455,395" fill="#0E2029"/>
        <rect x="255" y="325" width="285" height="4" fill="#14303C" opacity="0.8"/>

        <!-- Desk Surface Tabletop with Teal Glow Edge -->
        <rect x="225" y="242" width="355" height="10" rx="3" fill="#0E2029" stroke="rgba(20, 184, 166, 0.45)" stroke-width="1.2"/>
        <rect x="225" y="242" width="355" height="2.5" fill="#14B8A6"/>

        <!-- Desktop Monitor (All-in-one on sleek stand) -->
        <ellipse cx="380" cy="240" rx="32" ry="5" fill="#14303C"/>
        <path d="M376,240 L373,222 L387,222 L384,240 Z" fill="#1E3A47"/>
        <rect x="300" y="132" width="160" height="106" rx="9" fill="#0B1A22" stroke="#2DD4BF" stroke-width="2"/>
        <rect x="306" y="138" width="148" height="94" rx="6" fill="#07131A"/>

        <!-- Student Monitor Screen: 79% Grade Donut & UCS310 Lab 4 -->
        <circle cx="348" cy="172" r="17" stroke="#14303C" stroke-width="4" fill="none"/>
        <path d="M348,155 A17,17 0 1,1 334,183" stroke="#14B8A6" stroke-width="4" stroke-linecap="round" fill="none"/>
        <text x="348" y="176" font-family="'Plus Jakarta Sans',sans-serif" font-size="9.5" font-weight="800" fill="#E7F5F6" text-anchor="middle">79%</text>
        <rect x="375" y="162" width="65" height="3" rx="1.5" fill="#14303C"/>
        <rect x="375" y="169" width="48" height="3" rx="1.5" fill="#14B8A6"/>
        <rect x="375" y="176" width="56" height="3" rx="1.5" fill="#38BDF8"/>
        <rect x="316" y="200" width="128" height="20" rx="4" fill="#0E2029" stroke="rgba(20,184,166,0.3)" stroke-width="1"/>
        <text x="325" y="213" font-family="'JetBrains Mono',monospace" font-size="8" font-weight="700" fill="#5EEAD4">UCS310 Lab 4 · Done ✓</text>

        <!-- Floating Badges for Student (Radiating Arc above Monitor) -->
        <!-- 1. Orange/Coral Bubble: Verified Checkmark -->
        <g class="b-float-1">
          <circle cx="330" cy="100" r="14" fill="#F97316" filter="drop-shadow(0 4px 10px rgba(249, 115, 22, 0.45))"/>
          <path d="M324,100 L328.5,104.5 L336.5,95.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <!-- 2. Purple Bubble: Graduation Cap -->
        <g class="b-float-2">
          <circle cx="368" cy="74" r="15" fill="#8B5CF6" filter="drop-shadow(0 4px 10px rgba(139, 92, 246, 0.45))"/>
          <path d="M361,75 L368,71 L375,75 L368,79 Z" fill="#FFFFFF"/>
          <path d="M364,77 L364,81 C364,82.5 372,82.5 372,81 L372,77" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
          <line x1="375" y1="75" x2="375" y2="82" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        <!-- 3. Amber Bubble: A+ Grade Badge -->
        <g class="b-float-3">
          <circle cx="410" cy="76" r="15" fill="#F59E0B" filter="drop-shadow(0 4px 10px rgba(245, 158, 11, 0.45))"/>
          <text x="410" y="81" font-family="'Plus Jakarta Sans',sans-serif" font-size="11.5" font-weight="900" fill="#031417" text-anchor="middle">A+</text>
        </g>
        <!-- 4. Cyan Bubble: Attendance Calendar (75%) -->
        <g class="b-float-4">
          <circle cx="448" cy="100" r="14" fill="#38BDF8" filter="drop-shadow(0 4px 10px rgba(56, 189, 248, 0.45))"/>
          <rect x="442" y="94" width="12" height="11" rx="2" fill="none" stroke="#031417" stroke-width="1.6"/>
          <line x1="442" y1="97" x2="454" y2="97" stroke="#031417" stroke-width="1.4"/>
          <circle cx="445" cy="101" r="1" fill="#031417"/>
          <circle cx="448" cy="101" r="1" fill="#031417"/>
          <circle cx="451" cy="101" r="1" fill="#031417"/>
        </g>

        <!-- Desk Accessories: Red Coffee Mug with Steam -->

const pwIcon = document.getElementById('pwIcon');

if (pwToggle && pwInput) {
  pwToggle.addEventListener('click', () => {
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    pwIcon.textContent = isPw ? '🙈' : '👁️';
  });
}

// Preset Demo Credentials & Workstation Scene Data
const DEMO_PRESETS = {
  STUDENT: {
    u: 'kriti16',
    p: 'kri16',
    title: '🎓 Student Learning Desk',
    desc: 'Access enrolled course study materials, submit lab assignments, track 79% marks & 75% attendance.',
    sceneId: 'sceneStudent'
  },
  FACULTY: {
    u: 'rumneek24',
    p: 'rum24',
    title: '📘 Faculty Academic Portal',
    desc: 'Conduct lectures, evaluate student assignments with A+ feedback, and mark daily course attendance.',
    sceneId: 'sceneFaculty'
  },
  ADMIN: {
    u: 'doaa30',
    p: 'adm@123',
    title: '🛡️ Admin University Console',
    desc: 'Govern campus RBAC accounts, monitor live course enrollment graphs, and oversee 360° accountability.',
    sceneId: 'sceneAdmin'
  }
};

// Switch Role & Dynamically Swap Illustrated Workstations
window.switchAndFillRole = function(role) {
  const roleSelect = document.getElementById('role');
  const uInput = document.getElementById('username');
  const pInput = document.getElementById('password');
  const errBox = document.getElementById('loginError');

  const badgeEl = document.getElementById('illustRoleBadge');
  const descEl = document.getElementById('illustRoleDesc');

  if (roleSelect) roleSelect.value = role;
  if (errBox) errBox.textContent = '';

  // 1. Update Tab Buttons
  document.querySelectorAll('.role-tab-btn').forEach(btn => {
    if (btn.dataset.role === role) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });

  const preset = DEMO_PRESETS[role];
  if (!preset) return;

  // 2. Pre-fill Credentials
  if (uInput) uInput.value = preset.u;
  if (pInput) pInput.value = preset.p;

  // 3. Update Dynamic Illustration Title & Subtitle
  if (badgeEl) badgeEl.textContent = preset.title;
  if (descEl) descEl.textContent = preset.desc;

  // 4. Smooth Cross-Fade Switch of Illustrations
  document.querySelectorAll('.illust-scene').forEach(svg => {
    svg.classList.remove('active');
  });
  const targetSvg = document.getElementById(preset.sceneId);
  if (targetSvg) {
    targetSvg.classList.add('active');
  }
};

// Wire up Role Tab clicks
document.querySelectorAll('.role-tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    window.switchAndFillRole(btn.dataset.role);
  });
});

// Auto-populate default Student credentials and illustration on initial load
window.addEventListener('DOMContentLoaded', () => {
  window.switchAndFillRole('STUDENT');
});
</script>
